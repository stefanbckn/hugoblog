<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Coach Timer</title>
    <meta name="description" content="Trainingen met een timer, opstellingen en een eerlijk wisselschema voor jeugdvoetbal. Werkt zonder account, ook offline." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Coach Timer" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main id="view"></main>

    <nav class="tabs" aria-label="Tabbladen">
      <a href="#/trainingen" data-tab="trainingen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></svg>
        Trainingen
      </a>
      <a href="#/wedstrijden" data-tab="wedstrijden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/><path d="M3 9.5h2.5v5H3M21 9.5h-2.5v5H21"/></svg>
        Wedstrijden
      </a>
      <a href="#/ploeg" data-tab="ploeg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg>
        Ploeg
      </a>
    </nav>

    <section id="session" class="session" hidden aria-label="Timer"></section>
    <dialog id="dialog" class="sheet"></dialog>

    <noscript><p style="padding:16px">Coach Timer heeft JavaScript nodig.</p></noscript>
    <script type="module" src="js/app.js"></script>

</html>
